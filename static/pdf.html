<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <script src="node_modules/pdfjs-dist/build/pdf.js"></script>
  <style>
    #pdf-container {
      width: 100%;
      height: 600px;
      overflow: hidden;
      overflow-y: scroll;
      border: 3px solid red;
    }
    .pdf-box {
        position: relative;
      }

      .scroll-container {
        /* border: 3px solid red; */
        height: 600px;
        overflow: hidden;
        overflow-y: scroll;
      }
  </style>
</head>

<body>
  <div id="pdf-container"></div>
  </div>
    <script>
          let totals = []
          let pdfUrl = '/static/handler.pdf'
          let scale = 1
          // 接收消息并加载PDF
            window.addEventListener('message', function (event) {
              // console.log('event======', event)
              var action = event.data.action;
              if (action === 'load') {
                var pdfUrl = event.data.url;
                // 使用PDF.js API加载并渲染PDF
                this.loadPdf()
              }
            });

            function loadPdf() {
                window.parent.PDFJS.getDocument(pdfUrl).then(pdf => {
                  let totalPage = pdf.numPages;
                  console.log('PDF loaded', totalPage);

                  // 取得第一页
                  pdf.getPage(1).then(function (page) {
                    console.log('Page loaded', page);

                    var canvas = document.createElement("canvas");
                    var ctx = canvas.getContext('2d');
                    var viewport = page.getViewport(scale);
                    console.log('viewport======', viewport)

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    console.log(canvas)

                    // 渲染页码
                    var renderContext = {
                      canvasContext: ctx,
                      viewport: viewport
                    };
                    page.render(renderContext).then(function () {
                    //  return page.getTextContent();
                      document.getElementById('pdf-container').appendChild(canvas);
                    });
                });
              })
            }
                 function createCanvas(totalPages) {
                      for (let i = 1; i <= totalPages; i++) {
                        totals.push(i);
                      }
                    }

    </script>
</body>

</html>
