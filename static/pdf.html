<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <script src="node_modules/pdfjs-dist/build/pdf.js"></script>
  <!-- <style>
    #pdf-container {
      width: 100%;
      height: 100%;
      /* border: 3px solid red; */
    }
  </style> -->
</head>

<body>
  <div id="pdf-container"><h1>北京欢迎你～～～</h1></div>
    <script>
          let totals = []
          let pdfUrl = '../assets/handler.pdf'
          let scale = 1
          // 接收消息并加载PDF
            window.addEventListener('message', function (event) {
              // console.log('event======', event)
              var action = event.data.action;
              if (action === 'load') {
                var pdfUrl = event.data.url;
                // 使用PDF.js API加载并渲染PDF
                this.loadPdf()
              }
            });

            function loadPdf() {
                window.parent.PDFJS.getDocument(pdfUrl).then(pdf => {
                  let totalPage = pdf.numPages;
                  let idName = "canvas-pdf-";
                  // console.log('pdf=====', pdf, totalPage)
                  createCanvas(totalPage, idName);

                  for (let i = 1; i <= totalPage; i++) {
                    pdf.getPage(i).then(page => {
                      let pageDiv = document.getElementById(`page-${i}`);
                      let viewport = page.getViewport(this.scale);
                      let canvas = document.getElementById(idName + i);
                      let context = canvas.getContext("2d");
                      canvas.height = viewport.height;
                      canvas.width = viewport.width;
                      canvas.viewHeight = viewport.height;
                      let renderContext = {
                        canvasContext: context,
                        viewport
                      };
                      // 如果你只是展示pdf而不需要复制pdf内容功能，则可以这样写render
                      // page.render(renderContext) 如果你需要复制则像下面那样写利用text-layer
                      page
                        .render(renderContext)
                        .then(() => {
                          return page.getTextContent();
                        })
                        .then(textContent => {
                          // 创建文本图层div
                          const textLayerDiv = document.createElement("div");
                          textLayerDiv.setAttribute("class", "textLayer");
                          // 将文本图层div添加至每页pdf的div中
                          pageDiv.appendChild(textLayerDiv);
                          // 创建新的TextLayerBuilder实例
                          let textLayer = new TextLayerBuilder({
                            textLayerDiv: textLayerDiv,
                            pageIndex: page.pageIndex,
                            viewport: viewport
                          });
                          textLayer.setTextContent(textContent);
                          textLayer.render();
                        });
                    });
                  }
                });
              }

                 function createCanvas(totalPages) {
                      for (let i = 1; i <= totalPages; i++) {
                        totals.push(i);
                      }
                    }

    </script>
</body>

</html>
